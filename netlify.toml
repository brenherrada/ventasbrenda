[build]
  command = "npm run build"
  publish = "dist"

# This migration is verified through the separately authorized deploy-preview.
# A plain push must not create an unconfigured second preview or expand secrets.
[context.branch-deploy]
  ignore = 'test "$BRANCH" = "codex/catalogo-mejoras-y-migracion"'

[functions]
  directory = "netlify/functions"

[dev]
  publish = "."

[images]
  remote_images = ['^https://lh3\.googleusercontent\.com/d/[A-Za-z0-9_-]+=w(64|128|192|300|450|600|900|1200|1600)$']
